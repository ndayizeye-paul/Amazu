<!doctype html>
<html lang="rw" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C1612">
<title>Tegereza... - Amazu</title>
<script>(function(){var t='dark';try{var s=localStorage.getItem('theme');if(s==='light'||s==='dark')t=s}catch(e){}document.documentElement.setAttribute('data-theme',t)})();</script>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='brand/favicon.svg') }}">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<noscript><meta http-equiv="refresh" content="2;url={{ dest }}"></noscript>
</head>
<body>
<main class="welcome" role="status" aria-live="polite">
  <div class="welcome-in">
    <div class="w-mark"><img src="{{ url_for('static', filename='brand/logo-mark.svg') }}" alt=""></div>
    <h1>Karibu, {{ me.name.split()[0] }}</h1>
    <p>Turimo gufungura {{ label }}...</p>
    <div class="w-bar" aria-hidden="true"><i></i></div>
    <a class="w-skip" href="{{ dest }}">Niba bidakomeje, kanda hano</a>
  </div>
</main>
<script>
(function(){
  var rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function(){ location.replace({{ dest|tojson }}); }, rm ? 600 : 1800);
})();
</script>
</body>
</html>
